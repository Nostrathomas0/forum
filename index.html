// index.html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Greenbird</title>
    <link rel="shortcut icon" href="/image/yata.svg">
    
    <style link rel="stylesheet", href="assets/css/main.css">
        @import url('https://fonts.googleapis.com/css2?family=Permanent+Marker&family=Caveat:wght@400;700&display=swap');
        
   
    </style>
</head>
<body>
    <div class="chalk-dust"></div>
    
    <header>
        <h1> The Greenbird</h1>
        <p class="subtitle">Share your little picture </p>
    </header>
    
    <div class="container">
        <!-- Auth Section -->
        <div class="auth-box" id="authSection">
            <h2>Sign in to post</h2>
            <p style="margin-bottom: 20px;">Use your Languapps account to share your thoughts</p>
            <button onclick="signInWithGoogle()">Sign In with Google</button>
        </div>
        
        <div class="auth-box" id="userSection" style="display: none;">
            <div class="user-info">
                <span>✏️ Signed in as:</span>
                <span id="userName"></span>
                <button onclick="signOut()">Sign Out</button>
            </div>
        </div>
        
        <!-- Write Post Section (only visible when logged in) -->
        <div class="write-post-box" id="writePostBox" style="display: none;">
            <h2>✍️ Write on th' b'rd</h2>
            <input type="text" id="postTitle" placeholder="Title your thought..." maxlength="100">
            <textarea id="postContent" placeholder="Share what you learned today..."></textarea>
            <button onclick="createPost()">to th' b'rd</button>
        </div>
        
        <!-- Posts Display -->
        <div id="postsContainer" class="posts-grid">
            <div class="no-posts">Th' greenb'rd is empty... be th; first to write!</div>
        </div>
    </div>
    
    <div class="eraser" title="Erase posts (Admin only)"></div>

    <!-- Firebase -->
    <script type="module">
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js';
        import { getAuth, signInWithPopup, GoogleAuthProvider, onAuthStateChanged, signOut as firebaseSignOut } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js';
        import { getFirestore, collection, addDoc, query, orderBy, onSnapshot, deleteDoc, doc, serverTimestamp } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js';

        const firebaseConfig = {
            apiKey: "AIzaSyA_bq5-hmAlNbK-2ZgHSFl0Iew4uphF_Eo",
            authDomain: "languapps.firebaseapp.com",
            projectId: "languapps",
            storageBucket: "languapps.firebasestorage.app",
            messagingSenderId: "866735367707",
            appId: "1:866735367707:web:6154b4ab63fcab0272fabe"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const provider = new GoogleAuthProvider();

        let currentUser = null;
        const adminEmail = "Thomas@languapps.com"; // Change to your email

        // Auth state observer
        onAuthStateChanged(auth, (user) => {
            currentUser = user;
            if (user) {
                document.getElementById('authSection').style.display = 'none';
                document.getElementById('userSection').style.display = 'block';
                document.getElementById('writePostBox').style.display = 'block';
                document.getElementById('userName').textContent = user.displayName || user.email;
            } else {
                document.getElementById('authSection').style.display = 'block';
                document.getElementById('userSection').style.display = 'none';
                document.getElementById('writePostBox').style.display = 'none';
            }
        });

        // Sign in
        window.signInWithGoogle = async () => {
            try {
                await signInWithPopup(auth, provider);
            } catch (error) {
                console.error('Sign in error:', error);
                alert('Error signing in: ' + error.message);
            }
        };

        // Sign out
        window.signOut = async () => {
            try {
                await firebaseSignOut(auth);
            } catch (error) {
                console.error('Sign out error:', error);
            }
        };

        // Create post
        window.createPost = async () => {
            if (!currentUser) {
                alert('Please sign in first!');
                return;
            }

            const title = document.getElementById('postTitle').value.trim();
            const content = document.getElementById('postContent').value.trim();

            if (!title || !content) {
                alert('Please fill in both title and content!');
                return;
            }

            try {
                await addDoc(collection(db, 'blackboard_posts'), {
                    title: title,
                    content: content,
                    author: currentUser.displayName || currentUser.email,
                    authorId: currentUser.uid,
                    authorEmail: currentUser.email,
                    createdAt: serverTimestamp()
                });

                // Clear form
                document.getElementById('postTitle').value = '';
                document.getElementById('postContent').value = '';

                alert('Posted to the blackboard! ✓');
            } catch (error) {
                console.error('Error creating post:', error);
                alert('Error posting: ' + error.message);
            }
        };

        // Delete post
        window.deletePost = async (postId) => {
            if (!currentUser) return;

            if (confirm('Erase this from the blackboard?')) {
                try {
                    await deleteDoc(doc(db, 'blackboard_posts', postId));
                } catch (error) {
                    console.error('Error deleting post:', error);
                    alert('Error deleting: ' + error.message);
                }
            }
        };

        // Load posts
        const postsQuery = query(collection(db, 'blackboard_posts'), orderBy('createdAt', 'desc'));
        onSnapshot(postsQuery, (snapshot) => {
            const container = document.getElementById('postsContainer');
            
            if (snapshot.empty) {
                container.innerHTML = '<div class="no-posts">The blackboard is empty... be the first to write!</div>';
                return;
            }

            container.innerHTML = '';
            snapshot.forEach((doc) => {
                const post = doc.data();
                const postCard = document.createElement('div');
                postCard.className = 'post-card';
                
                const date = post.createdAt ? new Date(post.createdAt.toDate()).toLocaleDateString() : 'Just now';
                
                const canDelete = currentUser && (currentUser.uid === post.authorId || currentUser.email === adminEmail);
                
                postCard.innerHTML = `
                    <div class="post-title">${escapeHtml(post.title)}</div>
                    <div class="post-content">${escapeHtml(post.content)}</div>
                    <div class="post-meta">
                        <span class="post-author">~ ${escapeHtml(post.author)}</span>
                        <span class="post-date">${date}</span>
                    </div>
                    ${canDelete ? `<button class="delete-btn" onclick="deletePost('${doc.id}')">Erase ✗</button>` : ''}
                `;
                
                container.appendChild(postCard);
            });
        });

        // Escape HTML to prevent XSS
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
    </script>
</body>
</html>
